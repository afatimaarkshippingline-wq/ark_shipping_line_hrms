    </g>
    <text x="150" y="198" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="36" font-weight="900" fill="#1e293b" letter-spacing="1">ARK</text>
    <text x="150" y="228" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="4" fill="#64748b">SHIPPING LINE</text>
